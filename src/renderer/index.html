<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline';" />
    <title>Maple BossMule — Equipment Tracker</title>
    <style>
      :root { color-scheme: dark; }
      body {
        font-family: system-ui, sans-serif;
        margin: 0;
        background: #1b1d22;
        color: #e6e6e6;
        padding: 20px;
      }
      h1 { font-size: 20px; margin: 0 0 16px; }
      h2 { font-size: 15px; margin: 24px 0 8px; color: #9ad; }
      .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
      input, select, button {
        background: #2a2d34; color: #e6e6e6; border: 1px solid #3a3f48;
        border-radius: 6px; padding: 6px 10px; font-size: 13px;
      }
      button { cursor: pointer; }
      button:disabled { opacity: 0.4; cursor: default; }
      #drop {
        border: 2px dashed #3a3f48; border-radius: 10px; padding: 40px;
        text-align: center; color: #888; margin: 12px 0; cursor: pointer;
        transition: border-color 0.15s, background 0.15s;
      }
      #drop.over { border-color: #9ad; background: #22252c; color: #cde; }
      pre {
        background: #14161a; border: 1px solid #2a2d34; border-radius: 6px;
        padding: 12px; overflow: auto; max-height: 240px; font-size: 12px;
      }
      .card {
        background: #22252c; border: 1px solid #2a2d34; border-radius: 8px;
        padding: 12px 14px; margin: 8px 0;
      }
      .card h3 { margin: 0 0 8px; font-size: 14px; }
      .equip { font-size: 13px; margin: 4px 0; }
      .muted { color: #888; }
      table.roster { width: 100%; border-collapse: collapse; font-size: 12px; margin-top: 6px; }
      table.roster th, table.roster td { text-align: left; padding: 4px 8px; border-bottom: 1px solid #2a2d34; }
      table.roster th { color: #9ad; font-weight: 600; }
      table.roster td.num, table.roster th.num { text-align: right; font-variant-numeric: tabular-nums; }
      tr.item { cursor: pointer; }
      tr.item:hover { background: #262a31; }
      tr.totals td { border-top: 2px solid #3a3f48; font-weight: 600; color: #cde; }
      .star { color: #e0a93b; }
      .flame { color: #2ec4b6; }
      .setbadge { font-size: 11px; color: #9ad; }
      .detail { background: #1b1d22; }
      .detail-inner { padding: 8px 10px; }
      table.bd { border-collapse: collapse; font-size: 12px; margin: 4px 0; }
      table.bd th, table.bd td { padding: 2px 10px; text-align: right; }
      table.bd th:first-child, table.bd td:first-child { text-align: left; }
      table.bd th { color: #888; font-weight: 500; }
      .pot { margin-top: 6px; font-size: 12px; }
      .pot .tier { color: #5ac85a; font-weight: 600; }
      .struct dt { color: #9ad; font-size: 12px; margin-top: 6px; }
      .struct dd { margin: 0 0 2px; font-size: 13px; }
      .char-card { cursor: pointer; }
      .char-card:hover { border-color: #9ad; }
      .char-head { display: flex; gap: 8px; align-items: baseline; }
      .back-btn { margin-bottom: 10px; }
      .paperdoll { display: grid; grid-template-columns: repeat(5, 1fr); grid-auto-rows: 52px; gap: 6px; margin-top: 6px; }
      .pd-cell { border-radius: 6px; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 11px; padding: 2px; text-align: center; }
      .pd-cell.empty { border: 1px dashed #3a3f48; color: #666; }
      .pd-cell.filled { border: 1.5px solid #3a3f48; background: #22252c; cursor: pointer; }
      .pd-cell.filled:hover { filter: brightness(1.15); }
      .pd-label { color: #9aa; font-size: 10px; line-height: 1.1; }
      .pd-star { color: #e0a93b; font-size: 11px; }
      .pd-pot { color: #8cf; font-size: 9px; line-height: 1.1; }
      .pd-summary { border: 0.5px solid #2a2d34; border-radius: 8px; background: #1b1d22; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; padding: 8px; text-align: center; }
      .pd-name { font-weight: 600; font-size: 13px; }
      .pd-item { font-size: 9px; color: #cde; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; line-height: 1.1; }
      .pd-summary { min-width: 0; overflow: hidden; }
      .pd-summary .muted { overflow-wrap: anywhere; max-width: 100%; }
      .ms-row { display: flex; align-items: center; gap: 6px; margin: 4px 0 8px; font-size: 12px; }
      .slot-detail { margin-top: 10px; }
      .slot-detail-head { font-size: 13px; font-weight: 600; margin-bottom: 4px; color: #cde; }
      .ef-row { display: flex; align-items: center; gap: 8px; margin: 3px 0; font-size: 12px; }
      .ef-label { width: 92px; color: #9ad; }
      .ef-row input[type=text], .ef-row input[type=number] { flex: 1; }
      .ef-section { margin-top: 8px; color: #9ad; font-size: 12px; }
      .ef-stat, .ef-pot { display: flex; gap: 4px; margin: 2px 0; }
      .ef-key { width: 84px; }
      .ef-num { width: 58px; }
      #status { margin: 8px 0; font-size: 13px; color: #9ad; min-height: 18px; }
      .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
      @media (max-width: 780px) { .grid { grid-template-columns: 1fr; } }
    </style>
  </head>
  <body>
    <h1>🍁 Maple BossMule — Equipment Tracker <span class="muted">(Phase 2)</span></h1>

    <div class="row">
      <label for="engine">OCR engine:</label>
      <select id="engine"></select>
    </div>

    <div class="grid">
      <div>
        <h2>1. Capture equipment</h2>
        <div id="drop">Drop an equipment screenshot here, click to choose a file, or press Ctrl+V</div>
        <input type="file" id="file" accept="image/*" style="display:none" />
        <div class="row">
          <label for="character">Character:</label>
          <select id="character"></select>
          <label for="slot">Slot:</label>
          <select id="slot"></select>
          <button id="save" disabled>Save to character</button>
        </div>
        <div id="status"></div>
        <h2>Extracted (preview)</h2>
        <pre id="result"></pre>
      </div>

      <div>
        <h2>2. Add a boss mule</h2>
        <div class="row">
          <input type="text" id="charName" placeholder="Character name" />
          <input type="text" id="charJob" placeholder="Job (optional)" />
          <select id="charMainStat" title="Main stat">
            <option value="">Main: Auto</option>
            <option value="STR">STR</option>
            <option value="DEX">DEX</option>
            <option value="INT">INT</option>
            <option value="LUK">LUK</option>
          </select>
          <button id="addChar">Add</button>
        </div>
        <h2>Roster</h2>
        <div id="roster"></div>
      </div>
    </div>

    <script type="module" src="./renderer.js"></script>
  </body>
</html>
